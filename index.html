<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IGNITION</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;900&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --accent: #00f2ff; --bg: #030303; --card: rgba(255, 255, 255, 0.03); --primary: #8a2be2; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: white; font-family: 'Poppins', sans-serif; overflow-x: hidden; min-height: 100vh; }
        
        .hidden { display: none !important; }

        /* =========================================
           GLASSMORPHISM BACKGROUND DECOR
           ========================================= */
        .orb-container { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
        .orb { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.4; animation: float 20s infinite alternate; }
        
        .orb-1 { width: 400px; height: 400px; background: var(--primary); top: -100px; left: -100px; }
        .orb-2 { width: 500px; height: 500px; background: var(--accent); bottom: -150px; right: -150px; animation-delay: -5s; }
        .orb-3 { width: 300px; height: 300px; background: #ff00ea; top: 40%; right: 10%; opacity: 0.2; animation-delay: -10s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(20); }
            100% { transform: translate(50px, 50px) scale(0.5); }
        }

        /* =========================================
           VIEW 1: LANDING PAGE (HOME)
           ========================================= */
        #view-home {
            height: 100vh; width: 100%; display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center;
            padding: 0 10%; position: fixed; top: 0; left: 0; z-index: 5000;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
        }
        #view-home h1 { font-family: 'Outfit'; font-size: clamp(3rem, 10vw, 7rem); line-height: 1; margin-bottom: 15px; }
        #view-home h1 span { color: var(--accent); }
        #view-home p { color: #aaa; font-size: 1.1rem; max-width: 500px; margin-bottom: 40px; }
        
        .btn-enter { 
            background: #fff; color: #000; padding: 20px 50px; border-radius: 10px; 
            font-weight: 800; border: none; cursor: pointer; font-size: 1.1rem; 
            text-transform: uppercase; transition: 0.3s;
        }
        .btn-enter:hover { background: var(--accent); transform: scale(1.05); }

        /* =========================================
           VIEW 2: MAIN STORE 
           ========================================= */
        nav { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 20px 8%; background: rgba(0,0,0,0.4); backdrop-filter: blur(20px); 
            position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid rgba(255,255,255,0.05); 
        }
        .logo { font-family: 'Outfit'; font-size: 1.6rem; color: #fff; text-decoration: none; font-weight: 900; cursor: pointer; }
        .logo span { color: var(--accent); }
        
        .nav-links a { color: #888; text-decoration: none; font-weight: 600; cursor: pointer; font-size: 0.9rem; transition: 0.3s; margin-left: 20px; }
        .nav-links a.active { color: var(--accent); text-shadow: 0 0 10px var(--accent); }

        .container { padding: 60px 8%; position: relative; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 30px; margin-top: 18px; }

        /* GLASS CARD */
        .card { 
            background: var(--card); 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 16px; overflow: hidden; transition: 0.4s; 
        }
        .card:hover { border-color: var(--accent); transform: translateY(-8px); background: rgba(255,255,255,0.06); }
        
        .img-box { width: 100%; aspect-ratio: 1 / 1; overflow: hidden; }
        .card-img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; transition: 0.5s; }
        .card:hover .card-img { transform: scale(1.1); }

        .card-body { padding: 20px; }
        .card-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 18px; color: #fff; }
        
        .btn-card { width: 100%; padding: 14px; border-radius: 8px; border: none; font-weight: 800; cursor: pointer; text-decoration: none; text-align: center; font-size: 0.8rem; text-transform: uppercase; }
        .btn-buy { background: #fff; color: #000; }
        .btn-flm { background: var(--accent); color: #000; }

        /* GLASS PLAYER BAR */
        .player-bar { 
            position: fixed; bottom: 0; left: 0; width: 100%; 
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(20px); 
            border-top: 1px solid rgba(255,255,255,0.1); 
            padding: 15px 8%; display: flex; align-items: center; 
            justify-content: space-between; transform: translateY(100%); transition: 0.5s; z-index: 2000; 
        }
        .player-bar.active { transform: translateY(0); }

        /* GLASS MODAL */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; z-index: 3000; }
        .modal-content { 
            background: rgba(15, 15, 15, 0.95); backdrop-filter: blur(25px);
            padding: 40px; border-radius: 24px; width: 90%; max-width: 400px; 
            border: 1px solid rgba(255,255,255,0.1); text-align: center;
        }
        input { width: 100%; padding: 14px; margin: 10px 0; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 10px; outline: none; }
        input:focus { border-color: var(--accent); }

        @media (max-width: 768px) {
            .nav-links { display: flex; flex-direction: row; gap: 10px; margin-left: auto; }
            .nav-links a { margin-left: 0; font-size: 0.8rem; }
            .nav-links a.active { }
            .container { padding: 40px 5%; }
            .player-bar { padding: 15px 5%; }
        }
    </style>
</head>
<body>

    <!-- DECORATIVE BACKGROUND ORBS -->
    <div class="orb-container">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- VIEW 1: LANDING PAGE -->
    <section id="view-home">
        <h1>IGNI<span>TION</span></h1>
        <p>Premium dark-trap production and high-quality FLMS projects for the next generation of creators.</p>
        <button class="btn-enter" onclick="showView('store')">Open Store</button>
    </section>

    <!-- VIEW 2: STORE -->
    <div id="view-store" class="hidden">
        <nav>
            <div class="logo" onclick="showView('home')">IGNI<span>TION</span><div style="font-size: 0.5em; font-weight: 300; letter-spacing: 2px;">BY DRIVNIX</div></div>
            <div class="nav-links">
                <a id="tab-beats" class="active" onclick="switchTab('beats')">Beats</a>
                <a id="tab-flms" onclick="switchTab('flms')">FLMS Packs</a>
            </div>
        </nav>

        <div class="container">
            <h2 id="page-heading" style="margin-bottom: 4px; font-family: 'Outfit'; font-size: 2.2rem; letter-spacing: -1.5px;">AVAILABLE BEATS</h2>
            <p id="india-note" style="margin: 0; font-size: 0.75rem; color: #bbb; font-weight: 300; letter-spacing: 0.6px; line-height: 0.5;">FOR INDIANS ONLY DUE TO PAYMENT ISSUES</p>
            <div class="grid" id="main-grid">
                <!-- Data injected here -->
            </div>
        </div>
    </div>

    <!-- PLAYER BAR -->
    <div class="player-bar" id="player-bar">
        <div style="display:flex; align-items:center; gap:15px;">
            <img id="p-img" src="" style="width:55px; height:55px; border-radius:8px; object-fit: cover; border: 1px solid rgba(255,255,255,0.1);">
            <div>
                <h4 id="p-title" style="font-size: 0.95rem; margin-bottom: 2px;">Title</h4>
                <p style="font-size: 0.75rem; color: var(--accent); font-weight: 600;">PREVIEWING</p>
            </div>
        </div>
        <button onclick="togglePlay()" style="background:none; border:none; color:white; font-size:1.8rem; cursor:pointer;"><i class="fas fa-play" id="play-icon"></i></button>
        <button class="btn-buy" id="p-buy" style="width:auto; padding:10px 30px; border-radius: 8px;">ORDER</button>
    </div>

   <!-- MODAL AND FORM (FIXED: NOW NESTED CORRECTLY) -->
   <div id="order-modal" class="modal hidden">
        <div class="modal-content">
            <h2 id="order-item-title" style="font-family: 'Outfit'; margin-bottom: 10px;">Order</h2>
            <p style="font-size: 0.85rem; color: #888; margin-bottom: 25px;">Enter details to receive the payment link via email.</p>
            
            <!-- FORMSPREE EMAIL SYSTEM -->
            <form action="https://formspree.io/f/mojndeba" method="POST">
                
                <!-- 1. Hidden Subject Line -->
                <input type="hidden" name="_subject" value="New Beat Order Request!" />

                <!-- 2. Hidden Item Name -->
                <input type="hidden" name="item_name" id="form-item-name">

                <!-- 3. Customer Details -->
                <input type="text" name="name" placeholder="Full Name" required>
                <input type="email" name="email" placeholder="Email Address" required>

                <!-- 4. Send Button -->
                <button type="submit" class="btn-buy" style="width:100%; margin-top:15px; padding:16px; font-weight: 900; border-radius: 10px;">SEND REQUEST</button>
                
                <!-- 5. Close Button -->
                <button type="button" onclick="closeModal()" style="background:none; border:none; color:#555; width:100%; margin-top:20px; cursor:pointer; font-weight: 600; font-size: 0.8rem;">CLOSE</button>
            </form>
        </div>
    </div>

    <audio id="audio-player"></audio>

    <!-- DATABASE INJECTION -->
    <script id="database-injection">
        // --- PASTE ADMIN PANEL CODE BELOW ---
       const siteData = {
    "beats": [
        {
            "title": "NEON SHADOWS",
            "image": "https://i.ibb.co/Lwn4VjW/IMG-20251228-WA0006.jpg",
            "price": "₹99",
            "audio": "https://files.catbox.moe/f5u162.mp3"
        }
    ],
    "flms": [
        {
            "title": "NADA NADA",
            "image": "https://i.ibb.co/RGZWxgz1/download-2.jpg",
            "drive": "https://drive.google.com/file/d/1KrFs5MyK8wfTQVTWaS_Ml7w5Q_nVpAPj/view?usp=drivesdk"
        },
        {
            "title": "MONTAGEM BANDIDO",
            "image": "https://i.ibb.co/PvNQmJzQ/images-6.jpg",
            "drive": "https://drive.google.com/file/d/1nbmVAtZjmTCnFIZYomS_jyAESkAPAtfK/view?usp=drivesdk"
        }
    ]
};
        // ------------------------------------
    </script>

    <script>
        let currentTab = 'beats';
        const grid = document.getElementById('main-grid');
        const audio = document.getElementById('audio-player');

        // Add error listener for debugging
        audio.addEventListener('error', function(e) {
            console.error('Audio error:', e);
            console.error('Error code:', audio.error ? audio.error.code : 'unknown');
            alert('Audio failed to load. Check console for details.');
        });

        function showView(view) {
            if (view === 'home') {
                document.getElementById('view-home').classList.remove('hidden');
                document.getElementById('view-store').classList.add('hidden');
                document.getElementById('player-bar').classList.remove('active');
                audio.pause();
            } else {
                document.getElementById('view-home').classList.add('hidden');
                document.getElementById('view-store').classList.remove('hidden');
                renderStore();
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tab-beats').classList.toggle('active', tab === 'beats');
            document.getElementById('tab-flms').classList.toggle('active', tab === 'flms');
            document.getElementById('page-heading').innerText = tab === 'beats' ? 'AVAILABLE BEATS' : 'FLMS PROJECTS';
            renderStore();
        }

        function renderStore() {
            grid.innerHTML = '';
            const items = siteData[currentTab] || [];
            
            if (items.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 100px; color: #444;"><h3>Nothing found in this category.</h3></div>';
                return;
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                if (currentTab === 'beats') {
                    card.innerHTML = `
                        <div class="img-box"><img src="${item.image}" class="card-img" onclick="playTrack('${item.audio}', '${item.title}', '${item.image}')"></div>
                        <div class="card-body">
                            <div class="card-title">${item.title}</div>
                            <button class="btn-card btn-buy" onclick="openOrder('${item.title}')">BUY ${item.price}</button>
                        </div>`;
                } else {
                    card.innerHTML = `
                        <div class="img-box"><img src="${item.image}" class="card-img"></div>
                        <div class="card-body">
                            <div class="card-title">${item.title}</div>
                            <a href="${item.drive}" target="_blank" class="btn-card btn-flm">FREE DOWNLOAD</a>
                        </div>`;
                }
                grid.appendChild(card);
            });
        }

        function playTrack(url, title, img) {
            audio.src = url;
            audio.play().catch(err => {
                console.error('Playback error:', err);
                alert('Could not play audio: ' + err.message);
            });
            document.getElementById('player-bar').classList.add('active');
            document.getElementById('p-title').innerText = title;
            document.getElementById('p-img').src = img;
            document.getElementById('play-icon').className = 'fas fa-pause';
            
            // Connect ORDER button in player bar
            document.getElementById('p-buy').onclick = () => openOrder(title);
        }

        function togglePlay() {
            if (audio.paused) { audio.play(); document.getElementById('play-icon').className = 'fas fa-pause'; }
            else { audio.pause(); document.getElementById('play-icon').className = 'fas fa-play'; }
        }

        function openOrder(title) {
            document.getElementById('order-modal').classList.remove('hidden');
            document.getElementById('order-item-title').innerText = title;
            document.getElementById('form-item-name').value = title;
        }
        function closeModal() { document.getElementById('order-modal').classList.add('hidden'); }
    </script>
    
    <script>
    // Disable Right-Click
    document.addEventListener('contextmenu', event => event.preventDefault());

    // Disable F12 and Ctrl+Shift+I
    document.onkeydown = function(e) {
        if(e.keyCode == 123) return false; // F12
        if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false; // Ctrl+Shift+I
        if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false; // Ctrl+Shift+J
        if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false; // Ctrl+U (View Source)
    }
</script>
</body>
</html>
